name: intl_phone_number_input
publish_to: none
description: A customizable Flutter widget for entering and validating international phone numbers with phone_parser.
version: 0.7.3+1
homepage: https://github.com/natintosh/intl-phone-number-input
repository: https://github.com/natintosh/intl-phone-number-input

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  phone_parser:
    git: https://github.com/sumitsharansatsangi/phone_parser.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
