name: Package CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze package
        run: flutter analyze
      - name: Run tests
        run: flutter test
